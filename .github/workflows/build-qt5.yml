# WARNING: This file is completely generated by LLM and I have no idea how it works.

name: Build Extended Color Selector (Qt5)

# Builds the ExtendedColorSelector plugin against the exact Krita commit
# stored in `target_krita_commit`, for Windows / Linux / macOS, using Qt5.
#
# The flow mirrors Krita's official GitLab CI jobs:
#   build-tools/ci-scripts/windows.yml  -> Windows/Qt5/Shared
#   build-tools/ci-scripts/linux.yml    -> Linux/Qt5/Shared
#   build-tools/ci-scripts/macos.yml    -> MacOS/Qt5/Shared
#
# It fetches Krita's prebuilt Qt5 dependency packages through
# krita-deps-management / run-ci-build.py, then configures Krita with
# -DBUILD_WITH_QT6=OFF and builds only the `extendedcolorselector` target
# (which automatically builds kritaui and every library it depends on).

on:
  push:
    branches:
      - main-cpp
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build (${{ matrix.os }}, Qt5)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    concurrency:
      group: extended-color-selector-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Linux/Qt5/Shared
            deps_project: teams/ci-artifacts/krita-appimage
            artifact_suffix: linux
          - os: windows-2022
            platform: Windows/Qt5/Shared
            deps_project: teams/ci-artifacts/krita-windows
            artifact_suffix: windows
          - os: macos-14
            platform: MacOS/Qt5/Shared
            deps_project: teams/ci-artifacts/krita-macos
            artifact_suffix: macos

    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4

      - name: Set up Python 3.11 (for Krita CI tooling)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read target Krita commit and prepare paths
        shell: bash
        run: |
          set -euo pipefail

          KRITA_COMMIT="$(tr -d '[:space:]' < target_krita_commit)"
          if [ -z "$KRITA_COMMIT" ]; then
            echo "::error::target_krita_commit is empty or missing" >&2
            exit 1
          fi

          KRITA_SHORT="${KRITA_COMMIT:0:7}"
          REPO_SHORT="${GITHUB_SHA:0:7}"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            WS_UNIX="$(cygpath -u "$GITHUB_WORKSPACE")"
            KRITA_SRC='C:/_/krita-src'
            KRITA_SRC_UNIX='/c/_/krita-src'
            BUILD_ROOT='C:/_/work/krita'
            BUILD_ROOT_UNIX='/c/_/work/krita'
            ENV_FILE='C:/_/work/krita/env.bat'
          else
            WS_UNIX="$GITHUB_WORKSPACE"
            KRITA_SRC="$GITHUB_WORKSPACE/krita-src"
            KRITA_SRC_UNIX="$KRITA_SRC"
            BUILD_ROOT="$KRITA_SRC"
            BUILD_ROOT_UNIX="$KRITA_SRC"
            ENV_FILE="$KRITA_SRC/env"
          fi

          {
            echo "KRITA_COMMIT=${KRITA_COMMIT}"
            echo "KRITA_SHORT=${KRITA_SHORT}"
            echo "REPO_SHORT=${REPO_SHORT}"
            echo "ARTIFACT_NAME=ExtendedColorSelector-${REPO_SHORT}-${KRITA_SHORT}-${{ matrix.artifact_suffix }}"
            echo "WS_UNIX=${WS_UNIX}"
            echo "KRITA_SRC=${KRITA_SRC}"
            echo "KRITA_SRC_UNIX=${KRITA_SRC_UNIX}"
            echo "BUILD_ROOT=${BUILD_ROOT}"
            echo "BUILD_ROOT_UNIX=${BUILD_ROOT_UNIX}"
            echo "BUILD_DIR=${BUILD_ROOT}/_build"
            echo "BUILD_DIR_UNIX=${BUILD_ROOT_UNIX}/_build"
            echo "INSTALL_DIR=${BUILD_ROOT}/_install"
            echo "ENV_FILE=${ENV_FILE}"
          } >> "$GITHUB_ENV"

          echo "Building plugin repo ${REPO_SHORT} against Krita ${KRITA_SHORT} (${KRITA_COMMIT})"

      - name: Clone Krita at target_krita_commit
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$KRITA_SRC_UNIX"
          if [ ! -d "$KRITA_SRC_UNIX/.git" ]; then
            git clone --filter=blob:none --no-checkout https://github.com/KDE/krita.git "$KRITA_SRC_UNIX"
          fi

          if ! git -C "$KRITA_SRC_UNIX" cat-file -e "${KRITA_COMMIT}^{commit}" 2>/dev/null; then
            if ! git -C "$KRITA_SRC_UNIX" fetch --filter=blob:none origin "$KRITA_COMMIT"; then
              git -C "$KRITA_SRC_UNIX" fetch --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*'
            fi
          fi

          if ! git -C "$KRITA_SRC_UNIX" cat-file -e "${KRITA_COMMIT}^{commit}" 2>/dev/null; then
            # Fallback to Krita's primary GitLab mirror if GitHub does not carry the commit.
            git -C "$KRITA_SRC_UNIX" remote add invent https://invent.kde.org/graphics/krita.git || true
            git -C "$KRITA_SRC_UNIX" fetch --filter=blob:none invent "$KRITA_COMMIT" \
              || git -C "$KRITA_SRC_UNIX" fetch --filter=blob:none invent '+refs/heads/*:refs/remotes/invent/*'
          fi

          git -C "$KRITA_SRC_UNIX" config core.longpaths true
          git -C "$KRITA_SRC_UNIX" checkout --detach "$KRITA_COMMIT"
          git -C "$KRITA_SRC_UNIX" log -1 --oneline

      - name: Add plugin into Krita source tree
        shell: bash
        run: |
          set -euo pipefail

          PLUGIN_DIR="$KRITA_SRC_UNIX/plugins/ExtendedColorSelector"
          rm -rf "$PLUGIN_DIR"
          mkdir -p "$PLUGIN_DIR"

          git archive --format=tar HEAD -o plugin.tar
          tar -xf plugin.tar -C "$PLUGIN_DIR"
          rm -f plugin.tar

          if ! grep -qxF 'add_subdirectory( ExtendedColorSelector )' "$KRITA_SRC_UNIX/plugins/CMakeLists.txt"; then
            printf '\nadd_subdirectory( ExtendedColorSelector )\n' >> "$KRITA_SRC_UNIX/plugins/CMakeLists.txt"
          fi

          tail -n 8 "$KRITA_SRC_UNIX/plugins/CMakeLists.txt"

      - name: Install Linux system build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libxcb1-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            python3-dev \
            gettext

          # The Qt5 dependency packages plus the partial Krita build are large,
          # free everything the GitHub image does not need for this job.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc || true
          sudo apt-get clean
          df -h /

      - name: Install llvm-mingw Qt5/MinGW toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'C:\_', 'C:\_\downloads', 'C:\_\tools' | Out-Null
          gh release download 20251118 --repo mstorsjo/llvm-mingw --pattern 'llvm-mingw-20251118-ucrt-x86_64.zip' --dir 'C:\_\downloads'
          if (-not (Test-Path 'C:\_\tools\llvm-mingw-20251118-ucrt-x86_64\bin\cc.exe')) {
            Expand-Archive -Path 'C:\_\downloads\llvm-mingw-20251118-ucrt-x86_64.zip' -DestinationPath 'C:\_\tools' -Force
          }
          & 'C:\_\tools\llvm-mingw-20251118-ucrt-x86_64\bin\cc.exe' --version | Select-Object -First 1

      - name: Clone Krita CI dependency tooling and create Python venv
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d krita-deps-management/.git ]; then
            git clone --depth 1 -b master https://invent.kde.org/packaging/krita-deps-management.git
          fi
          if [ ! -d krita-deps-management/ci-utilities/.git ]; then
            git clone --depth 1 -b master https://invent.kde.org/packaging/krita-ci-utilities.git krita-deps-management/ci-utilities
          fi

          python -m venv venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_PY_UNIX="$WS_UNIX/venv/Scripts/python.exe"
            REQUIREMENTS_FILE="$(cygpath -m "$WS_UNIX/krita-deps-management/requirements.txt")"
          else
            VENV_PY_UNIX="$WS_UNIX/venv/bin/python"
            REQUIREMENTS_FILE="$WS_UNIX/krita-deps-management/requirements.txt"
          fi
          "$VENV_PY_UNIX" -m pip install -r "$REQUIREMENTS_FILE"

          echo "VENV_PY_UNIX=${VENV_PY_UNIX}" >> "$GITHUB_ENV"
          echo "DEPS_ROOT_UNIX=${WS_UNIX}/krita-deps-management" >> "$GITHUB_ENV"

      - name: Download macOS build tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$WS_UNIX/cache/downloads"
          export EXTERNALS_DOWNLOAD_DIR="$WS_UNIX/cache/downloads"
          "$VENV_PY_UNIX" -u "$DEPS_ROOT_UNIX/tools/download-macos-tools.py"
          test -f "$WS_UNIX/_krita-tools/activate"

      - name: Fetch Qt5 dependencies and generate build environment
        shell: bash
        run: |
          set -euo pipefail

          export KDECI_GITLAB_SERVER=https://invent.kde.org/
          export KDECI_PACKAGE_PROJECT='${{ matrix.deps_project }}'
          export KDECI_BUILD_TYPE=Release
          export KDECI_COMPRESS_PACKAGES_ON_DOWNLOAD=False
          export CI_COMMIT_REF_PROTECTED=true
          export PYTHONUTF8=1

          SEED_FILE="$DEPS_ROOT_UNIX/latest/krita-deps.yml"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mkdir -p /c/_/cache /c/_/work
            export KDECI_CACHE_PATH='C:\_\cache'
            export KDECI_WORKDIR_PATH='C:\_\work'
            export KDECI_REPO_METADATA_PATH="$(cygpath -m "$DEPS_ROOT_UNIX/repo-metadata")"
            export PATH="/c/_/tools/llvm-mingw-20251118-ucrt-x86_64/bin:/c/_/tools/llvm-mingw-20251118-ucrt-x86_64/x86_64-w64-mingw32/bin:$PATH"
            SEED_FILE="$(cygpath -m "$SEED_FILE")"
            DEPS_TOOLS="$(cygpath -m "$DEPS_ROOT_UNIX/tools")"
            CI_UTILS="$(cygpath -m "$DEPS_ROOT_UNIX/ci-utilities")"
          else
            mkdir -p "$WS_UNIX/cache"
            export KDECI_CACHE_PATH="$WS_UNIX/cache"
            export KDECI_REPO_METADATA_PATH="$DEPS_ROOT_UNIX/repo-metadata"
            DEPS_TOOLS="$DEPS_ROOT_UNIX/tools"
            CI_UTILS="$DEPS_ROOT_UNIX/ci-utilities"
            if [[ "$RUNNER_OS" == "macOS" ]]; then
              source "$WS_UNIX/_krita-tools/activate"
              export MACOSX_DEPLOYMENT_TARGET=10.14
              export QMAKE_MACOSX_DEPLOYMENT_TARGET=10.14
            fi
          fi

          cd "$KRITA_SRC_UNIX"

          "$VENV_PY_UNIX" -u "$DEPS_TOOLS/replace-branch-in-seed-file.py" \
            "$SEED_FILE" -p -o branch-corrected-deps.yml -d master
          "$VENV_PY_UNIX" -u "$DEPS_TOOLS/generate-deps-file.py" \
            -s branch-corrected-deps.yml -o .kde-ci.yml
          "$VENV_PY_UNIX" -u "$CI_UTILS/run-ci-build.py" \
            --project krita \
            --branch master \
            --platform '${{ matrix.platform }}' \
            --skip-publishing \
            --only-env \
            -e env

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            test -f "$BUILD_ROOT_UNIX/env.bat"
          else
            test -f "$ENV_FILE"
          fi
          echo "Qt5 dependency environment is ready"

      - name: Configure and build plugin with Qt5 (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eo pipefail

          source "$ENV_FILE"

          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export MACOSX_DEPLOYMENT_TARGET=10.14
            export QMAKE_MACOSX_DEPLOYMENT_TARGET=10.14
            TOOLCHAIN_ARGS=(-DCMAKE_TOOLCHAIN_FILE="$DEPS_ROOT_UNIX/tools/macos-toolchain-krita.cmake")
            JOBS="$(sysctl -n hw.ncpu)"
          else
            TOOLCHAIN_ARGS=()
            JOBS="$(nproc)"
          fi

          cmake -S "$KRITA_SRC" -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_WITH_QT6=OFF \
            -DHIDE_SAFE_ASSERTS=OFF \
            -DKRITA_ENABLE_PCH=OFF \
            -DFOUNDATION_BUILD=ON \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_DIR" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            "${TOOLCHAIN_ARGS[@]}"

          cmake --build "$BUILD_DIR" --target extendedcolorselector --parallel "$JOBS"

      - name: Configure and build plugin with Qt5 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call C:\_\work\krita\env.bat
          cmake -S C:\_\krita-src -B C:\_\work\krita\_build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DBUILD_WITH_QT6=OFF -DHIDE_SAFE_ASSERTS=OFF -DKRITA_ENABLE_PCH=OFF -DFOUNDATION_BUILD=ON -DCMAKE_INSTALL_PREFIX=C:\_\work\krita\_install -DCMAKE_C_COMPILER=cc -DCMAKE_CXX_COMPILER=c++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          if errorlevel 1 exit /b 1
          cmake --build C:\_\work\krita\_build --target extendedcolorselector --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Verify the build used Qt5
        shell: bash
        run: |
          set -euo pipefail

          QT_MAJOR="$(sed -n 's/^QT_MAJOR_VERSION:INTERNAL=//p' "$BUILD_DIR_UNIX/CMakeCache.txt" | tr -d '\r')"
          QT6_FLAG="$(sed -n 's/^BUILD_WITH_QT6:BOOL=//p' "$BUILD_DIR_UNIX/CMakeCache.txt" | tr -d '\r')"

          echo "QT_MAJOR_VERSION=${QT_MAJOR:-<unset>}"
          echo "BUILD_WITH_QT6=${QT6_FLAG:-<unset>}"

          if [ "$QT_MAJOR" != "5" ]; then
            echo "::error::The build did not use Qt5 (QT_MAJOR_VERSION=${QT_MAJOR:-unset})"
            exit 1
          fi
          if [ "$QT6_FLAG" != "OFF" ]; then
            echo "::error::BUILD_WITH_QT6 is ${QT6_FLAG:-unset}, expected OFF"
            exit 1
          fi

      - name: Stage plugin package
        shell: bash
        run: |
          set -euo pipefail

          STAGE_UNIX="$WS_UNIX/extended_color_selector"
          rm -rf "$STAGE_UNIX"
          mkdir -p "$STAGE_UNIX/lib"

          cp "$KRITA_SRC_UNIX/plugins/ExtendedColorSelector/extended_color_selector.desktop" \
            "$WS_UNIX/extended_color_selector.desktop"
          cp -R "$KRITA_SRC_UNIX/plugins/ExtendedColorSelector/python/." "$STAGE_UNIX/"

          # Krita's build system places the module in different spots depending
          # on platform, so look for every platform naming variant.
          BIN=""
          for name in \
            extendedcolorselector.dll \
            libextendedcolorselector.so \
            libextendedcolorselector.dylib \
            extendedcolorselector.so; do
            if [ -f "$BUILD_DIR_UNIX/bin/$name" ]; then
              BIN="$BUILD_DIR_UNIX/bin/$name"
              break
            fi
          done
          if [ -z "$BIN" ]; then
            BIN="$(find "$BUILD_DIR_UNIX" -type f \( \
              -name 'extendedcolorselector.dll' \
              -o -name 'libextendedcolorselector.so' \
              -o -name 'libextendedcolorselector.dylib' \
              -o -name 'extendedcolorselector.so' \) -print -quit)"
          fi
          if [ -z "$BIN" ] || [ ! -f "$BIN" ]; then
            echo "::error::Built plugin binary was not found in $BUILD_DIR_UNIX" >&2
            exit 1
          fi

          cp "$BIN" "$STAGE_UNIX/lib/"
          echo "Staged plugin package:"
          find "$WS_UNIX/extended_color_selector" -type f | sed "s|$WS_UNIX/||"
          ls -la "$WS_UNIX/extended_color_selector.desktop"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            extended_color_selector.desktop
            extended_color_selector
          if-no-files-found: error
          retention-days: 14

      - name: Collect diagnostics on failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          DIAG="$WS_UNIX/diagnostics"
          mkdir -p "$DIAG"
          for rel in \
            CMakeCache.txt \
            CMakeFiles/CMakeConfigureLog.yaml \
            CMakeFiles/CMakeError.log \
            CMakeFiles/CMakeOutput.log; do
            src="$BUILD_DIR_UNIX/$rel"
            if [ -f "$src" ]; then
              mkdir -p "$DIAG/$(dirname "$rel")"
              cp "$src" "$DIAG/$rel"
            fi
          done
          find "$DIAG" -type f

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ExtendedColorSelector-diagnostics-${{ matrix.artifact_suffix }}
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
